<!DOCTYPE html>
<!--Le dice al navegador que el documento debe leerse en HTML5-->

<html lang="en">
<!-- Especifica que el idioma principal es español -->

<head>
    <meta charset="UTF-8">
    <!--Permite el uso de caracteres especiales como tildes, la letra ñ o signos especiales. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Hace que el ancho de página 
    <title>Parrafos HTML</title>
</head>

<body>
    <h1>Estructura del HTML</h1>
    <!--Es el titulo principal de la página -->
    <h2>HTML</h2>
    <!--Titulo de tamaño mas pequeño-->
    <p>Envuelve todo el contenido de la página</p>
    <!--Primer
    <h2>Head</h2>
    <p>Contiene los metadatos del sitio web,
        configuraciones y el titulo de la pestaña
    </p>
    <h2>Body</h2>
    <p>Muestra los elementos visuales que ve el usuario</p>
    <h2>Footer</h2>
    <p>Muestra la informacion del autor de la pagina,
        creditos, informacion relevante, etc.
    </p>
</body>

</html>
