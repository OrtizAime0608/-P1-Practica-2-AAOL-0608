<!DOCTYPE html>

<!--Le dice al navegador que el documento debe leerse en HTML5 , su version mas reciente-->
<html lang="en">
    <!--Define el ingles como el idioma principal-->
    
<head>
    <meta charset="UTF-8">
    <!--Permite el uso de caracteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Ajusta el ancho de la pantalla segun el dispositivo donde abras la pagina-->
    <title>Imagenes en HTML</title>
    <!--Titulo principal de la pagina-->
</head>
<body>
    <h2>Imagenes en HTML</h2>
    <!--Titulo mas importante del contenido-->
    <!-- Utilizamos 'img' para agregar una imagen a nuestro html-->

    <!--Estas 2 imagenes no las puedo vizualizar ya que necesito tenerlas descargadas en mi servidor-->
    
    <h3>Locales</h3>
    <img src="caritas.png" alt="Imagen de carita feliz">
    <!-- Llama imagenes locales , es decir que esten dentro de la misma direccion que tu html-->


    
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!--Llama imagenes locales , pero que no estan en la misma direccion que tu archivo html , por lo cual llama con la carpeta donde estan y luego con el nombre del archivo-->
    <!--Ademas define el alto y el ancho que medira la imagen-->

    
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <!--Sirve para insertar una imagen traida desde internet, introduce el link url de la imagen-->
    <!--Ademas define el alto y el ancho que medira la imagen y deja la descripcion de la imagen en blanco-->


    <!--Estas 2 imagenes si las puedo vizualizar ya que son de la web-->

    <h3>Animaciones</h3>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
    <!--Sirve para insertar una animacion sacada de una pagina web, se introduce el url de la animacion-->
    <!--Ademas define el alto y el ancho que medira la imagen y deja la descripcion de la imagen en blanco-->
    
</body>
</html>
