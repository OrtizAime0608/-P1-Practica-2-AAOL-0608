<!DOCTYPE html>

<!--0608-->

<!--Le dice al navegador que lea la pagina como html5-->
<html lang="en">
  <!--Inicia el codigo y define el ingles como el idioma principal-->
<head>
    <meta charset="UTF-8">
    <!--Permite el uso de caracteres especiales como ñ o acentos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Ajusta el ancho de la pantalla segun el dispositivo-->
    <title>Enlaces en HTML</title>
    <!--Titulo principal de la pagina-->
</head>
<body>
    <h2>Tipos de enlaces en HTML</h2>
    <!--Titulo mas grande del contenido-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <!--En esta linea vizualizamos un parrafo que aparece en negritas gracias a la funcion <strong>-->

  <!--De la linea 22 a la 40 nos muestra una serie de enlaces usando <a> , los cuales son archivos internos , dentro de el necesitas poner el enlace al que quieres redireccionarte en 'href', luego el nombre que aparececera en la pantalla y 
  cierrras </a> , despues vemos un salto de linea , el cual nos sirve para que cada enlace aparezca en lineas distintas-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
  
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <!-- 'target=' nos sirve para definir donde se abrira el nuevo documento , en este caso se abrira en la misma pestaña-->
  
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <!--En este caso el enlace se abrira en una pestaña nueva -->
  
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <!--Para entender esta linea es necesario entender que unicamente se usa en el caso de tener un <inframe> lo cual abre una ventana mas pequeña con contenido de otra pagina web , dentro de tu ventana-->
    <!--En este caso parent abre un archivo interno html , mas sin embargo lo abre en una ventana nueva como si fuera un archivo externo-->
  
  
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <!--Por ultimo esta funciona eliminando las ventanas de <inframe> , y abre todo en la pantalla completa del navegador-->

    <!--Esta seccion nos muestra las mismas funciones , con la excepcion de que aqui abre enlaces externos-->
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body>
  <!--Cierra el codigo-->
</html>
