<!DOCTYPE html>
<!--Le dice al navegador que el documento debe leerse en HTML5-->
<html lang="en">
    <!--Inicia el codigo y define el ingles como idioma principal-->

<head>
    <meta charset="UTF-8">
    <!--Permite que se vizualicen correctamente caracteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Sirve para que el ancho de la pagina se adapte segun el dispositivo que uses-->
    <title>Salto de linea en HTML</title>
    <!--Titulo principal de la pagina-->
</head>

<body>
    <h1>Lenguaje de programacion</h1>
    <!--Primer titulo (Principal del contenido de la pagina)-->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br>
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
    <!-- En estas lineas nos muestra el uso de 'br' dentro de un parrafo , mostrando que cada 'br' que se agregue se dara un salto de linea , sin necesidad de agregar o crear mas parrafos-->
</body>

    <!--Cierra el codigo-->
</html>
